name: Nevis Wealth
description: >-
  Nevis (Nevis Wealth) is an AI platform built for wealth management firms, giving
  financial advisors an AI assistant that automates administrative work — AI-generated
  meeting summaries, automatic task capture from client interactions, intelligent
  meeting-prep briefs, unified AI search across advisory systems, personalized client
  email drafting, and account-opening automation — so advisors spend more time with
  clients and less on paperwork. The company is used by advisory firms including United
  Capital, GC Wealth, Apollon Wealth, and Dodds Wealth, is SOC 2 Type I certified, and
  has raised $40M in venture funding. Nevis does not currently publish a public API,
  developer portal, SDKs, or developer documentation.
